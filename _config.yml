# coldnight theme configuration
# All settings here can be overridden in the site's _config.yml under `theme_config:`

navbar:
  title: "My Blog"
  icon: ""             # image path ("/images/logo.png") OR emoji/short text ("❄"); empty = built-in SVG logo
  icon_color: ""       # CSS color for the text icon (e.g. "#60a5fa"); ignored for images; empty = inherit
  icon_after: ""       # optional image path OR emoji/text rendered after the title; empty = nothing
  icon_after_color: "" # CSS color for the after-title text icon; ignored for images; empty = inherit
  links:
    - name: Home
      url: /
    - name: Archive
      url: /archives
    - name: About
      url: /about

favicon: ""            # image path ("/favicon.png", "/icon.svg"); anything else (incl. empty) = theme default favicon.svg/.ico

sidebar:
  position: right      # left | right | hidden
  about: true          # false = hide the About widget (also auto-hides when author/bio/avatar/social are all empty)
  widgets:
    - toc
    - recent_posts
    - tags
    - archives
    - about

sponsor:
  enabled: false
  label: "Buy me a coffee"
  url: ""

social:
  github: ""
  twitter: ""
  rss: true
  share: false   # show X/Twitter + LinkedIn + copy-link buttons in the post footer

reading_time: true     # show "N min read" on post cards and post header
word_count: true       # show raw word count ("1,240 words") in the post header
image_captions: true   # wrap standalone images with non-empty alt text in <figure>/<figcaption>
external_links: true   # add target="_blank" rel="noopener noreferrer" and ↗ icon to external links in post body
glossary: true         # wrap first occurrence of terms from source/_data/glossary.yml in <abbr> tooltips
category_descriptions: {}  # map of category name → hover/focus tooltip text; empty = no category tooltips
permalink_button: true # copy-to-clipboard link icon in post metadata row
difficulty: true       # 1–5 difficulty/effort signal-bar meter (front-matter difficulty:/effort:)
epub_export: true      # "Export as ePub" download button in the post metadata row

toc:
  enabled: true
  max_depth: 3   # 2 = h2 only, 3 = h2 + h3

progress_bar: true   # reading progress bar on post pages
sticky_title: true   # fade post title into navbar when h1 scrolls out of view

heatmap:
  enabled: true   # GitHub-style posting-activity calendar on the archive page
  weeks: 52       # number of weeks to show, ending on the current week

stats:
  enabled: false  # opt-in — emit a /stats/ page with build-time posting statistics

links:
  title: ""       # h1 on the links page; empty = page front-matter title, then "Links"
  subtitle: ""    # optional line under the h1; empty = nothing
                  # tag filter chips appear automatically when any entry in
                  # source/_data/links.yml carries a `tags:` field

related_posts: true  # "You might also like" section at the bottom of post pages
series: true         # series navigation strip for multi-part posts (requires series: in front-matter)

stale_warning:
  enabled: false     # show "this post is old" banner on posts older than `months`
  months: 24         # age threshold; based on updated: (or date:) at build time

view_transitions: true # cross-document View Transitions crossfade (progressive enhancement)

search:
  enabled: true   # search box in navbar

code:
  copy_button: true    # show copy-to-clipboard button on code blocks
  language_label: true # show language tag top-right of code blocks
  collapse: true       # auto-collapse long code blocks behind an Expand button
  collapse_lines: 25   # visible lines when collapsed; blocks must exceed this by 5+ lines to collapse

grid:
  columns: 1           # index page columns (1 = list view, 2–6 = grid)
  rows: 3              # rows per page; per_page is auto-set to columns × rows

cover:
  default: ""          # fallback image path when no cover_image set in post front-matter
  fallback: true       # false = posts without cover_image render no card/hero thumbnail (og:image still uses cover.default)
  large: false         # true = card/hero thumbnail spans full width above the text instead of beside it
  aspect_ratio: "16/9"

lightgallery:
  enabled: true        # include LightGallery CDN assets
  auto_mount: true     # auto-wrap .post-body images as gallery items
  zoom: true           # enable zoom plugin
  thumbnail: true      # enable thumbnail strip plugin

mermaid:
  enabled: true        # render mermaid fenced code blocks as SVG diagrams
  theme: dark          # mermaid theme: default | dark | neutral | forest

math:
  enabled: true        # render $...$ and $$...$$ as KaTeX math

pdf_viewer: true       # load pdf-viewer.js on post pages; set false to disable
audio_player: true     # load audio-player.js on post pages that use {% audio %}; set false to disable
compare_slider: true   # load compare-slider.js on post pages that use {% compare %}; set false to disable
video_facade: true     # click-to-load facade for {% video %} YouTube/Vimeo embeds; false = eager iframes (tag stays enabled)

model_viewer:
  enabled: true
  background: "#1a1a2e"   # canvas background colour

json_feed:
  enabled: true        # emit /feed.json (JSON Feed 1.1, jsonfeed.org) — independent of social.rss
  limit: 20            # number of newest posts included; invalid or missing = 20

link_check:
  enabled: true        # warn at build time about internal links with no matching route
  fail: false          # true = exit code 1 when broken links are found (for CI)

llms_txt:
  enabled: false       # opt-in — emit /llms.txt (LLM-friendly site index per llmstxt.org)
  full: true           # when enabled, also emit /llms-full.txt with complete post/project markdown
                       # per-page opt-out: set `llms_txt: false` in any post/page front-matter

giscus:
  enabled: false          # opt-in — set true after completing giscus.app setup
  repo: ""                # "owner/repo"
  repo_id: ""             # from giscus.app
  category: ""            # discussion category name
  category_id: ""         # from giscus.app
  mapping: pathname       # pathname | url | title | og:title
  reactions_enabled: true
  input_position: bottom  # top | bottom
  theme: dark_dimmed      # giscus theme — dark_dimmed matches coldnight palette
  lang: ""                # empty = inherit site config.language
